apiVersion: v1
kind: ConfigMap
metadata:
  name: podacium-config
  namespace: podacium
data:
  APP_NAME: "Podacium API"
  ENVIRONMENT: "production"
  PORT: "8000"
  JWT_ALGORITHM: "RS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "14"
  PAYMENT_GATEWAY: "chargily"
  CHARGILY_MODE: "live"
