apiVersion: apps/v1
kind: Deployment
metadata:
  name: podacium-api
  namespace: podacium
  labels:
    app: podacium-api
spec:
  replicas: 2
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: podacium-api
  template:
    metadata:
      labels:
        app: podacium-api
        track: stable
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: podacium-api
      containers:
        - name: api
          image: podacium/api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: podacium-secrets
            - configMapRef:
                name: podacium-config
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Startup: slow initialization (DB pool warmup, migration check)
          # Allows the pod to run for up to 60s before being killed by liveness.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          # Readiness: /health checks DB connectivity (gate traffic only when DB is ready)
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          # Liveness: /healthz is a lightweight process ping (no DB dependency)
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
