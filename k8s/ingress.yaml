apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podacium-ingress
  namespace: podacium
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.podacium.com
      secretName: podacium-api-tls
    - hosts:
        - podacium.com
      secretName: podacium-web-tls
  rules:
    - host: api.podacium.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: podacium-api
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: podacium-api
                port:
                  number: 8000
    - host: podacium.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: podacium-web
                port:
                  number: 80
