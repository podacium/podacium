[mypy]
python_version = 3.11
ignore_missing_imports = True
exclude = (?x)(
    \.venv
    | venv
    | node_modules
    | \.pytest_cache
    | \.ruff_cache
    | build
    | dist
    | services/api/podacium
    | services/api/app/generated
    | apps/web/node_modules
    | apps/web/\.next
  )
explicit_package_bases = True
namespace_packages = True
