# =============================================================
# podacium.com — Nginx Site Configuration
# =============================================================
# This file is included from nginx.conf http block.
# Rate limiting zones are defined in nginx.conf.
# Block order:
#   1. Catch-all: reject unknown domains & direct IP access
#   2. Block stf-dz.com completely
#   3. HTTP → HTTPS redirect
#   4. WWW → non-WWW redirect (HTTPS)
#   5. Main site: podacium.com (Next.js on :3000)
#   6. Backend API: backend-api.podacium.com (FastAPI on :8000)
# =============================================================


# -------------------------------------------------------------
# 1. CATCH-ALL — Reject unknown domains & direct IP access
# -------------------------------------------------------------
server {
    listen 80  default_server;
    listen [::]:80  default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/podacium.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/podacium.com/privkey.pem;

    return 444;
}


# -------------------------------------------------------------
# 2. BLOCK stf-dz.com explicitly
# -------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stf-dz.com www.stf-dz.com;

    ssl_certificate     /etc/letsencrypt/live/podacium.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/podacium.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 444;
}


# -------------------------------------------------------------
# 3. HTTP → HTTPS redirect
# -------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name podacium.com www.podacium.com backend-api.podacium.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# -------------------------------------------------------------
# 4. WWW → non-WWW redirect (HTTPS)
# -------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.podacium.com;

    ssl_certificate     /etc/letsencrypt/live/podacium.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/podacium.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://podacium.com$request_uri;
}


# -------------------------------------------------------------
# 5. MAIN SITE — podacium.com (Next.js on :3000)
# -------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name podacium.com;

    ssl_certificate     /etc/letsencrypt/live/podacium.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/podacium.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security    "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options             "DENY"                                         always;
    add_header X-Content-Type-Options      "nosniff"                                      always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy          "camera=(), microphone=(), geolocation=()"     always;
    add_header Cross-Origin-Opener-Policy  "same-origin"                                  always;
    add_header Cross-Origin-Resource-Policy "cross-origin"                                always;
    # CSP is dynamically managed by Next.js middleware.ts to prevent header collisions.

    access_log /var/log/nginx/podacium-access.log;
    error_log  /var/log/nginx/podacium-error.log;

    # Domain ownership verification
    location = /_uu35cdoh9pqvq3za88v72mnp6vga9d8b {
        default_type text/plain;
        alias /opt/podacium/apps/web/public/_uu35cdoh9pqvq3za88v72mnp6vga9d8b.txt;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Next.js build assets — served directly from disk
    location /_next/static/ {
        alias   /opt/podacium/apps/web/.next/static/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public assets — served directly from disk
    location /public/ {
        alias   /opt/podacium/apps/web/public/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Proxy /health to backend API for CSRF token seeding
    # (Frontend fetches /health to set the csrf_token cookie via backend's CSRF middleware)
    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → Next.js
    location / {
        limit_req zone=frontend_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;

        proxy_set_header X-Real-IP            $remote_addr;
        proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto    $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}


# -------------------------------------------------------------
# 6. BACKEND API — backend-api.podacium.com (FastAPI on :8000)
# -------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name backend-api.podacium.com;

    ssl_certificate     /etc/letsencrypt/live/podacium.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/podacium.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security    "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options      "nosniff"                                      always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin"              always;
    add_header X-Frame-Options             "DENY"                                         always;
    add_header Permissions-Policy          "camera=(), microphone=(), geolocation=()"     always;
    add_header Cross-Origin-Opener-Policy  "same-origin"                                  always;
    add_header Cross-Origin-Resource-Policy "cross-origin"                                always;
    # API subdomain CSP — locked down (no UI, no scripts, no frames)
    add_header Content-Security-Policy    "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # CORS is handled by FastAPI's CORSMiddleware — do NOT duplicate here.
    # (nginx sets duplicate headers which browsers reject.)

    # Allow large file uploads (video streaming up to 2GB, plus overhead)
    client_max_body_size 2000m;

    access_log /var/log/nginx/api-access.log;
    error_log  /var/log/nginx/api-error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ⚠️  /static/* is intentionally NOT handled here — uploaded files require JWT
    # authentication. ALL /static/* requests are forwarded to FastAPI's
    # _AuthenticatedStaticFiles middleware which verifies the JWT before serving.
    # Serving them from Nginx directly would bypass authentication entirely.
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Stricter rate limit for auth endpoints (prevent brute force)
    location ~ ^/(api/v1/auth/login|api/v1/auth/register|api/v1/auth/forgot-password|api/v1/auth/reset-password) {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;

        proxy_set_header X-Real-IP            $remote_addr;
        proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto    $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}