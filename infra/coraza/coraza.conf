# =============================================================================
# Coraza Web Application Firewall — Configuration
# =============================================================================
# Coraza runs as a sidecar proxy between Caddy and the FastAPI backend.
# It inspects all HTTP traffic and blocks requests matching attack patterns
# (SQLi, XSS, path traversal, LFI, RFI, command injection, etc.).
# OWASP Core Rule Set (CRS) 4.x is enabled for comprehensive protection.
# =============================================================================

[default]
# Upstream backend (FastAPI)
upstream = "api:8000"

# Listen address (Caddy reverse proxies to this)
listen = ":8080"

# OWASP Core Rule Set 4.x — include all CRS rules
# CRS rules are loaded from /etc/coraza/crs-setup.conf and /etc/coraza/rules/*.conf
Include /etc/coraza/crs-setup.conf
Include /etc/coraza/rules/*.conf

# Block dangerous executable files and path traversal in upload filenames
SecRule FILES "@rx (?i)\.(php|phtml|phar|sh|bash|exe|dll|bat|cmd|vbs)$" \
    "id:10001,phase:2,deny,status:403,msg:'Executable upload blocked',logdata:'%{MATCHED_VAR}'"

# Block sensitive credentials and private keys leaked in response bodies
SecRule RESPONSE_BODY "@rx (-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----|postgres(?:ql)?:\/\/[a-zA-Z0-9_\-\.]+:[^@\s]+@)" \
    "id:10002,phase:4,deny,status:500,msg:'Sensitive data leak detected in response',logdata:'%{MATCHED_VAR}'"

# Rate limiting rules (complementing Caddy/Redis)
SecRule IP:REQ_COUNTER "@gt 500" \
    "id:10003,phase:2,deny,status:429,msg:'Request limit exceeded'"

# Block SQL injection patterns (additional to CRS)
SecRule REQUEST_BODY "@rx (?i)(\bSELECT\b.*\bFROM\b|\bUNION\b.*\bSELECT\b|\bINSERT\b.*\bINTO\b|\bDELETE\b.*\bFROM\b|\bDROP\b.*\bTABLE\b)" \
    "id:10004,phase:2,deny,status:403,msg:'SQL injection blocked',logdata:'%{MATCHED_VAR}'"

# Block XSS patterns in request (additional to CRS)
SecRule REQUEST_BODY "@rx (<script|javascript:|onerror=|onload=|onmouseover=|onclick=|onfocus=)" \
    "id:10005,phase:2,deny,status:403,msg:'XSS blocked',logdata:'%{MATCHED_VAR}'"

# Block command injection (additional to CRS)
SecRule REQUEST_BODY "@rx (;\s*(ls|cat|rm|wget|curl|bash|sh|powershell|cmd|nc|netcat)\s)" \
    "id:10006,phase:2,deny,status:403,msg:'Command injection blocked',logdata:'%{MATCHED_VAR}'"

# Block path traversal attempts
SecRule REQUEST_URI|REQUEST_BODY|ARGS "@rx (\.\./|\.\.\\|%2e%2e%2f|%2e%2e/)" \
    "id:10007,phase:2,deny,status:403,msg:'Path traversal blocked',logdata:'%{MATCHED_VAR}'"

# Block LDAP injection
SecRule REQUEST_BODY|ARGS "@rx (\(\|\)|\(\&|\|\))" \
    "id:10008,phase:2,deny,status:403,msg:'LDAP injection blocked',logdata:'%{MATCHED_VAR}'"

# Block XXE attempts
SecRule REQUEST_BODY "@rx (<!ENTITY|<!DOCTYPE)" \
    "id:10009,phase:2,deny,status:403,msg:'XXE blocked',logdata:'%{MATCHED_VAR}'"

# Block SSRF attempts
SecRule REQUEST_BODY|ARGS "@rx (http://localhost|http://127\.0\.0\.1|http://169\.254\.169\.254|http://\[::1\])" \
    "id:10010,phase:2,deny,status:403,msg:'SSRF blocked',logdata:'%{MATCHED_VAR}'"

# Secure headers enforcement (phase 3 - response)
SecRule RESPONSE_HEADERS:Content-Security-Policy "!@rx ^" \
    "id:10011,phase:3,pass,msg:'CSP header missing',setvar:'tx.csp_missing=1'"

SecRule RESPONSE_HEADERS:X-Frame-Options "!@rx ^DENY$" \
    "id:10012,phase:3,pass,msg:'X-Frame-Options not DENY'"

SecRule RESPONSE_HEADERS:X-Content-Type-Options "!@rx ^nosniff$" \
    "id:10013,phase:3,pass,msg:'X-Content-Type-Options not nosniff'"

# Debug logging (adjust log level as needed)
# SecDebugLog /var/log/coraza/debug.log
# SecDebugLogLevel 3